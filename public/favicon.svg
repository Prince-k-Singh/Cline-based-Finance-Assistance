<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Prospera">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14254a"/>
      <stop offset="1" stop-color="#0a1328"/>
    </linearGradient>
    <linearGradient id="b1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ff6ff"/><stop offset="1" stop-color="#1aa3c4" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="b2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ad8ff"/><stop offset="1" stop-color="#2a6fd6" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="b3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d58bff"/><stop offset="1" stop-color="#7b3fe0" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="b4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dffb0"/><stop offset="1" stop-color="#1fb86a" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9a1f"/><stop offset="1" stop-color="#ffe066"/>
    </linearGradient>
    <radialGradient id="coin" cx=".38" cy=".32" r=".75">
      <stop offset="0" stop-color="#fff2a8"/><stop offset=".55" stop-color="#ffc233"/><stop offset="1" stop-color="#d9800f"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- tile -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- faint grid -->
  <g stroke="#3d6bb3" stroke-opacity=".22" stroke-width=".6">
    <path d="M0 16H64M0 32H64M0 48H64M16 0V64M32 0V64M48 0V64"/>
  </g>
  <!-- network dots -->
  <g fill="#5fd4ff" opacity=".85">
    <circle cx="8" cy="9" r="1.2"/><circle cx="20" cy="6" r=".9"/><circle cx="56" cy="22" r=".9"/>
  </g>
  <path d="M8 9L20 6" stroke="#5fd4ff" stroke-opacity=".5" stroke-width=".6"/>

  <!-- neon bars -->
  <g filter="url(#glow)" stroke-width="1.1">
    <rect x="8"  y="44" width="9" height="14" rx="1.5" fill="url(#b1)" stroke="#9ff9ff"/>
    <rect x="20" y="38" width="9" height="20" rx="1.5" fill="url(#b2)" stroke="#8fe2ff"/>
    <rect x="32" y="31" width="9" height="27" rx="1.5" fill="url(#b3)" stroke="#e3b0ff"/>
    <rect x="44" y="24" width="9" height="34" rx="1.5" fill="url(#b4)" stroke="#a8ffc9"/>
  </g>

  <!-- rising zig-zag arrow -->
  <g filter="url(#glow)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 40L19 30L27 34L46 15" fill="none" stroke="url(#arrow)" stroke-width="4"/>
    <path d="M40 12.5L51.5 9.5L48.5 21Z" fill="#ffe066" stroke="#ffd23f" stroke-width="1.5"/>
  </g>

  <!-- gold coin -->
  <g filter="url(#glow)">
    <circle cx="17" cy="17" r="9" fill="url(#coin)" stroke="#ffd65a" stroke-width="1"/>
    <circle cx="17" cy="17" r="6.6" fill="none" stroke="#b5650a" stroke-opacity=".55" stroke-width=".8"/>
    <text x="17" y="21.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="11.5" fill="#8a4a05">$</text>
  </g>
</svg>
